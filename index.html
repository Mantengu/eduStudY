<!DOCTYPE html>
<html>
<head>
  <title>Welcome to EduStudy</title>
  <link rel="stylesheet" href="css sheet.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background-color: black;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .welcome-title {
      font-size: 48px;
      color: #33fffc;
      margin-bottom: 20px;
    }

    .enter-btn {
      background: #33fffc;
      color: black;
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      transition: 0.3s;
    }

    .enter-btn:hover {
      background: #1b7775;
    }

    .quote {
      font-style: italic;
      font-size: 18px;
      margin-bottom: 40px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="welcome-title">Welcome to EduStudy</div>
  <div class="quote">"Empowering learners through access to knowledge."</div>
  <a href="mainpage.html" class="enter-btn"><i class="fas fa-door-open"></i> Enter Site</a>
  
 
 

</body>
</html>
